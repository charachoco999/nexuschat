name: i18n catalog check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every catalog key in every locale
        run: node scripts/check-i18n.mjs
