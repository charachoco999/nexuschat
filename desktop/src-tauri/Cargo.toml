[package]
name = "nexus-desktop"
version = "0.9.0-alpha.3"
description = "Nexus Desktop"
authors = ["Nexus"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
